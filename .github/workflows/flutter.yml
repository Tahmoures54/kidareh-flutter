name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Normalize formatting in the CI workspace so legacy/minified files
      # cannot prevent analysis and tests from running.
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
